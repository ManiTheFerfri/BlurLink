name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (matches FileVersion)'
        required: true

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the helper
        run: |
          cmake -S src/BlurLink.Net -B out/native -DCMAKE_BUILD_TYPE=Release
          cmake --build out/native --config Release 2>&1 | Tee-Object -FilePath out/release-build.log; exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-build-log
          path: out/release-build.log
      - name: File build log as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tail = Get-Content out/release-build.log -Tail 120 -ErrorAction SilentlyContinue
          if (-not $tail) { $tail = '(no build log captured)' }
          ($tail -join "`n") | gh issue create --title "CI build failure: release helper ($env:GITHUB_SHA)" --body-file -
      - name: Package
        shell: pwsh
        run: |
          $version = if ('${{ github.event.inputs.version }}') { '${{ github.event.inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          scripts/package-release.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: BlurLink-release
          path: dist/release/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
